packages:
  - '.'
  - 'mobile-app'
  - 'monitoring'

# 安全修复：将存在漏洞的传递依赖强制提升到已修复版本
overrides:
  node-forge: '>=1.4.1'
  proxy-addr: '>=2.0.8'
  postcss: '>=8.5.18'
  tar: '>=7.5.22'
  shell-quote: '>=1.12.0'
  nanoid: '^3.3.18'
  source-map-js: '^1.2.2'
  browserslist: '^4.29.5'
  fast-uri: '^3.1.7'
  js-yaml: '^4.3.2'
  webpack-dev-middleware: '^7.4.5'
  joi: '^17.13.9'
  # high 漏洞修复（按大版本选择，避免影响无关依赖）
  'brace-expansion@1': '^1.1.21'
  'brace-expansion@2': '^2.1.4'
  'brace-expansion@5': '^5.0.12'
  'zod': '^4.6.7'
  'ip-address': '^10.7.5'
  'undici@6': '^6.29.1'
  'form-data': '^4.0.6'
  'follow-redirects': '^1.16.2'
  'compression': '^1.8.2'
  'axios': '^1.21.0'
  '@xmldom/xmldom@0.8': '^0.8.15'
  '@xmldom/xmldom@0.9': '^0.9.12'
  'decode-uri-component': '^0.5.1'
